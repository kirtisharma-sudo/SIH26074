<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Planner · Panchayat Weather Intelligence</title>
<link rel="stylesheet" href="assets/fx.css">
<style>
:root{--g:#183B36;--s:#F4EFE3;--t:#C8754D;--w:#FFFDF8;--m:#6f6e66;box-sizing:border-box;color-scheme:light}
html{scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--w);color:var(--g);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.se{font-family:"Bookman Old Style",Bookman,Georgia,serif;font-weight:400;letter-spacing:-.025em}
.mt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--m)}
.wr{max-width:1240px;margin:0 auto;padding:0 28px}
.open{padding:90px 0 40px;text-align:center}.open h1{font-size:clamp(30px,4.8vw,58px);line-height:1.2;max-width:15em;margin:10px auto 0}
.open p{max-width:36em;margin:18px auto 0;color:var(--m);font-size:15px}
section{padding-top:70px}h2{font-size:clamp(24px,3.2vw,38px);line-height:1.1;margin:6px 0 18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:8px 0 22px}
label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--m)}
select,input{font:inherit;font-size:14px;padding:10px 12px;border:1px solid #d9d2bf;border-radius:6px;background:#fff;color:var(--g);transition:.25s}
select:hover,input:hover,select:focus,input:focus{border-color:var(--t);box-shadow:0 0 16px rgba(200,117,77,.35);outline:none}
.fxbtn{background:var(--g);color:var(--s);border:0;border-radius:6px;padding:11px 20px;font:inherit;cursor:pointer}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.big{font-size:clamp(30px,4vw,46px);line-height:1}.dk{background:var(--g);color:var(--s);border-radius:6px}
.day{cursor:pointer;text-align:center;padding:14px 6px;border-radius:8px;border:1px solid #e6e0d0;background:#fff;transition:.3s;min-width:0}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.day:hover{transform:translateY(-8px) scale(1.09);z-index:2}.day.sel{background:var(--g);color:var(--s);box-shadow:0 0 28px rgba(24,59,54,.55)}
.day .ic{font-size:26px}.day b{display:block;font-size:17px}.day i{display:block;height:5px;border-radius:9px;margin-top:8px}
.go{background:#6cbf95;box-shadow:0 0 12px #6cbf95}.hold{background:#e0b04a;box-shadow:0 0 12px #e0b04a}.stop{background:#d0564a;box-shadow:0 0 12px #d0564a}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;margin:3px 4px 0 0;background:var(--s)}
.stage{height:10px;border-radius:9px;background:#e9e3d2;overflow:hidden;margin-top:12px}.stage div{height:100%;width:0;background:linear-gradient(90deg,var(--t),var(--k,#8fd6bf));transition:width 1.2s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px var(--t)}
</style></head><body>
<header class="open wr"><span class="mt">Field calendar</span><h1 class="se">Plan the next ten days, <em>field by field.</em></h1><p>Pick a Panchayat, a crop and a sowing date. The planner turns a downscaled forecast into daily go / hold calls for irrigation, spraying and field work.</p></header>
<section><div class="wr"><div class="row">
<label>Panchayat<select id="pn"><option>Chandipur</option><option>Rampur</option><option>Devgarh</option><option>Sitapur</option><option>Kishanpur</option><option>Baldev Nagar</option></select></label>
<label>Crop<select id="cr"><option>Wheat</option><option>Mustard</option><option>Maize</option><option>Rice</option><option>Cotton</option></select></label>
<label>Sowing date<input type="date" id="sd"></label><button class="fxbtn" id="go">Plan my days</button></div>
<div class="days" id="days"></div></div></section>
<section><div class="wr"><h2 class="se" id="dt">Pick a day</h2><div class="g3">
<div class="fxc"><span class="mt">Today's calls</span><div id="calls" style="margin-top:8px"></div></div>
<div class="fxc"><span class="mt">Crop stage</span><div class="big se" id="stg" style="margin-top:8px">-</div><div class="stage"><div id="sb"></div></div><p id="sn" style="color:var(--m)"></p></div>
<div class="fxc"><span class="mt">Ten-day totals</span><div class="big se" id="tot" style="margin-top:8px">-</div><p id="tn" style="color:var(--m)"></p></div></div></div></section>
<div style="height:90px"></div>
<script>
const $=s=>document.querySelector(s),PN=["Chandipur","Rampur","Devgarh","Sitapur","Kishanpur","Baldev Nagar"];
const CR={Wheat:{base:5,heat:34,st:["Germination","Tillering","Jointing","Heading","Grain fill","Maturity"],cut:[10,35,60,85,110,130]},Mustard:{base:5,heat:32,st:["Germination","Rosette","Flowering","Pod fill","Maturity"],cut:[8,30,55,85,120]},Maize:{base:10,heat:38,st:["Emergence","Vegetative","Tasselling","Silking","Grain fill","Maturity"],cut:[8,30,55,65,95,115]},Rice:{base:10,heat:36,st:["Nursery","Tillering","Panicle start","Flowering","Milking","Maturity"],cut:[25,55,75,95,115,135]},Cotton:{base:15,heat:39,st:["Emergence","Squaring","Flowering","Boll set","Boll opening"],cut:[15,55,90,130,180]}};
$("#sd").value=new Date(Date.now()-864e5*40).toISOString().slice(0,10);
function rnd(seed){return()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296}
let F=[],CH=null;
function build(){const p=$("#pn").value,c=CR[$("#cr").value],r=rnd(PN.indexOf(p)*977+11+new Date().getDate()*13);
F=[];for(let i=0;i<10;i++){const rain=r()<.35?Math.round(r()*38):0,tx=Math.round(26+r()*14),tn=Math.round(tx-10-r()*6),wind=Math.round(4+r()*20),hum=Math.round(40+r()*50),d=new Date(Date.now()+864e5*i);
const heat=tx>c.heat,frost=tn<4,calls=[];
calls.push(rain>=8?["stop","Skip irrigation","Rain of "+rain+" mm will do the work."]:["go","Irrigate if soil is dry","No meaningful rain expected."]);
calls.push(rain<1&&wind<12&&hum<85?["go","Spray window open","Calm, dry air: little drift or wash-off."]:["hold","Hold spraying",(rain>=1?"Rain will wash product off":"Wind "+wind+" km/h drifts spray")+"."]);
if(heat)calls.push(["stop","Heat stress risk","Tmax "+tx+" °C is above the "+c.heat+" °C comfort limit for this crop."]);
if(frost)calls.push(["stop","Frost risk overnight","Tmin "+tn+" °C: cover nurseries, irrigate lightly in the evening."]);
if(rain>=25)calls.push(["stop","Drain fields","Heavy rain: open outlets to avoid waterlogging."]);
const sc=calls.some(x=>x[0]=="stop")?"stop":calls.some(x=>x[0]=="hold")?"hold":"go";
F.push({d,rain,tx,tn,wind,hum,calls,sc})}
$("#days").innerHTML=F.map((f,i)=>`<div class="day" data-i="${i}"><span class="mt">${f.d.toLocaleDateString("en-IN",{weekday:"short"})}</span><b class="se">${f.d.getDate()}</b><div class="ic">${f.rain>=25?"⛈":f.rain>=8?"🌧":f.rain>0?"🌦":f.tx>c.heat?"☀":"⛅"}</div><span>${f.tx}°/${f.tn}°</span><i class="${f.sc}"></i></div>`).join("");
document.querySelectorAll(".day").forEach(e=>e.onclick=()=>pick(+e.dataset.i));
const das=Math.max(0,Math.floor((Date.now()-new Date($("#sd").value))/864e5)),k=c.cut.findIndex(x=>das<=x),si=k<0?c.st.length-1:k;
$("#stg").textContent=c.st[si];$("#sn").textContent="Day "+das+" after sowing. Crop base temperature "+c.base+" °C.";
setTimeout(()=>$("#sb").style.width=Math.min(100,das/c.cut[c.cut.length-1]*100)+"%",80);
const rt=F.reduce((a,f)=>a+f.rain,0),skip=F.filter(f=>f.rain>=8).length,spr=F.filter(f=>f.calls[1][0]=="go").length,gdd=Math.round(F.reduce((a,f)=>a+Math.max(0,(f.tx+f.tn)/2-c.base),0));
$("#tot").textContent=rt+" mm rain";$("#tn").textContent=skip+" irrigation days can be skipped, "+spr+" clean spray windows, "+gdd+" growing degree days gained.";pick(0)}
function pick(i){const f=F[i];document.querySelectorAll(".day").forEach((e,j)=>e.classList.toggle("sel",i==j));
$("#dt").textContent=f.d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})+" · "+$("#pn").value;
$("#calls").innerHTML=f.calls.map(c=>`<div style="margin:10px 0"><span class="tag" style="background:none;padding:0"><i class="${c[0]}" style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px"></i><b>${c[1]}</b></span><div style="color:var(--m);font-size:13px">${c[2]}</div></div>`).join("")+`<span class="tag">Rain ${f.rain} mm</span><span class="tag">Wind ${f.wind} km/h</span><span class="tag">Humidity ${f.hum}%</span>`}
$("#go").onclick=build;["pn","cr"].forEach(x=>$("#"+x).onchange=build);build();
</script>
<script src="assets/fx.js"></script>
</body></html>
